name: ♻️ Reusable — Deploy

on:
  workflow_call:
    inputs:
      environment-name:
        description: "Nom de l'environnement GitHub (test / qualif / production)"
        type: string
        required: true
      compose-file:
        description: "Fichier docker-compose à utiliser sur le serveur distant"
        type: string
        required: true
      remote-path:
        description: "Répertoire de déploiement sur le serveur distant"
        type: string
        required: true
      health-url:
        description: "URL à vérifier après déploiement (endpoint /health)"
        type: string
        required: true
      image-tag:
        description: "Tag de l'image Docker à déployer"
        type: string
        required: true
      enable-db-backup:
        description: "Effectuer un mysqldump avant migration"
        type: boolean
        required: false
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: 🚀 Deploy → ${{ inputs.environment-name }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ inputs.health-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR/OCI exige des noms d'image en minuscules
      - name: Set lowercase image name
        id: lower
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Resolve full image reference
        id: image
        run: echo "full=${{ steps.lower.outputs.name }}:${{ inputs.image-tag }}" >> $GITHUB_OUTPUT

      - name: Save current image for rollback
        run: echo "CURRENT_IMAGE=${{ steps.image.outputs.full }}" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ inputs.remote-path }}

            # Sauvegarde du tag actuel pour rollback
            CURRENT_TAG=$(docker compose -f ${{ inputs.compose-file }} images -q app | head -1)
            echo "$CURRENT_TAG" > .last_deployed_image

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ steps.image.outputs.full }}

            if [ "${{ inputs.enable-db-backup }}" = "true" ]; then
              mkdir -p /backups
              docker compose -f ${{ inputs.compose-file }} exec -T db \
                mysqldump -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" \
                > /backups/${{ inputs.environment-name }}-$(date +%Y%m%d%H%M%S).sql || true
            fi

            export APP_IMAGE="${{ steps.image.outputs.full }}"
            export APP_VERSION="${{ github.sha }}"

            docker compose -f ${{ inputs.compose-file }} pull
            docker compose -f ${{ inputs.compose-file }} up -d --remove-orphans

            docker compose -f ${{ inputs.compose-file }} exec -T app \
              php bin/console doctrine:migrations:migrate --no-interaction

            docker image prune -f --filter "until=72h"

      - name: Healthcheck HTTP
        run: |
          sleep 15
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ inputs.health-url }})
            if [ "$STATUS" = "200" ]; then
              echo "✅ Healthcheck OK (attempt $i)"
              exit 0
            fi
            echo "⏳ Attempt $i — HTTP $STATUS"
            sleep 10
          done
          echo "❌ Healthcheck failed"
          exit 1

      - name: Auto Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ inputs.remote-path }}
            echo "🔄 Rollback en cours..."
            LAST_IMAGE=$(cat .last_deployed_image)
            sed -i "s|APP_IMAGE=.*|APP_IMAGE=$LAST_IMAGE|" .env
            docker compose -f ${{ inputs.compose-file }} up -d
            echo "✅ Rollback terminé"