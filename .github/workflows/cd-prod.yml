name: 🏁 CD — Production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag Docker à déployer en prod"
        required: true
      confirm:
        description: "Taper DEPLOY pour confirmer"
        required: true

jobs:
  pre-deploy-check:
    name: 🛡️ Pre-deploy Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "❌ Confirmation invalide. Tapez DEPLOY pour confirmer."
            exit 1
          fi

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          fi
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}

  deploy:
    needs: pre-deploy-check
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment-name: production
      compose-file: docker-compose.prod.yml
      remote-path: /opt/apps/production
      health-url: https://your-app.com/health
      image-tag: ${{ needs.pre-deploy-check.outputs.image-tag }}
      enable-db-backup: true
    secrets: inherit

  release:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true