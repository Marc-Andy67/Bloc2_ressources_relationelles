name: 🔬 CI/CD — Tests, Build & Déploiement

on:
  push:
    branches: [ "devellop", "qualif", "main" ]
  pull_request:
    branches: [ "devellop", "qualif", "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"

jobs:
  lint:
    name: 🧹 Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, intl, mbstring, xml, zip
          coverage: none

      - name: 📦 Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: 📦 Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: 🔒 Security audit (composer)
        run: composer audit

      - name: Lint YAML
        run: php bin/console lint:yaml config --parse-tags

      - name: Lint Twig
        run: php bin/console lint:twig templates

      - name: Lint DI Container
        run: php bin/console lint:container

      - name: 🔍 PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=256M

  tests:
    name: 🧪 Tests PHPUnit
    runs-on: ubuntu-latest
    needs: lint

    permissions:
      checks: write
      contents: read
      pull-requests: write

    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/resources_relationnelles_test?serverVersion=8.0&charset=utf8mb4"
      APP_ENV: test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: resources_relationnelles_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, intl, mbstring, xml, zip
          coverage: xdebug

      - name: 📦 Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: 📦 Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: 🗄️ Create database & run migrations
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction

      - name: 🌱 Load fixtures
        run: php bin/console doctrine:fixtures:load --no-interaction

      - name: 📦 Install importmap assets
        run: php bin/console importmap:install

      - name: 🧪 Run PHPUnit
        run: |
          php bin/phpunit \
            --coverage-text \
            --coverage-clover=coverage.xml \
            --log-junit=junit.xml

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: 📋 Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: junit.xml

  resolve-env:
    name: 🧭 Résolution environnement
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push'
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      image_tag: ${{ steps.map.outputs.image_tag }}
      stack_dir: ${{ steps.map.outputs.stack_dir }}
    steps:
      - name: 🗺️ Mapper branche → environnement
        id: map
        run: |
          case "${{ github.ref_name }}" in
            devellop)
              echo "environment=test" >> "$GITHUB_OUTPUT"
              echo "image_tag=test" >> "$GITHUB_OUTPUT"
              echo "stack_dir=resources-relationnelles-test" >> "$GITHUB_OUTPUT"
              ;;
            qualif)
              echo "environment=qualif" >> "$GITHUB_OUTPUT"
              echo "image_tag=qualif" >> "$GITHUB_OUTPUT"
              echo "stack_dir=resources-relationnelles-qualif" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "image_tag=prod" >> "$GITHUB_OUTPUT"
              echo "stack_dir=resources-relationnelles-production" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Branche non mappée : ${{ github.ref_name }}" >&2
              exit 1
              ;;
          esac

  docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: resolve-env
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔡 Nom d'image en minuscules
        id: lower
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.lower.outputs.name }}
          tags: |
            type=raw,value=${{ needs.resolve-env.outputs.image_tag }}
            type=sha,prefix=${{ needs.resolve-env.outputs.image_tag }}-sha-

      - name: 🐳 Build & Push Docker image (target production)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_ENV=prod
            REPOSITORY=${{ github.repository }}

  deploy:
    name: 🚀 Déploiement (${{ needs.resolve-env.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [ resolve-env, docker ]
    if: github.event_name == 'push'
    environment: ${{ needs.resolve-env.outputs.environment }}

    steps:
      - name: 🚀 Pull & redéploiement via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_BASE_PATH }}/${{ needs.resolve-env.outputs.stack_dir }}

            IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "APP_IMAGE=${IMAGE_NAME}:${{ needs.resolve-env.outputs.image_tag }}" > .env.image

            docker compose --env-file .env --env-file .env.image pull
            docker compose --env-file .env --env-file .env.image up -d --remove-orphans

            docker compose --env-file .env --env-file .env.image exec -T app \
              php bin/console lexik:jwt:generate-keypair --skip-if-exists

            docker compose --env-file .env --env-file .env.image exec -T app \
              php bin/console doctrine:migrations:migrate --no-interaction

            docker image prune -f

      - name: ✅ Healthcheck post-déploiement
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sleep 5
            curl -fsS ${{ secrets.DEPLOY_HEALTHCHECK_URL }} > /dev/null
