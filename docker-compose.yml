name: symfony-dev
services:
  app:
    image: ghcr.io/marc-andy67/bloc2_ressources_relationelles:latest
    env_file:
      - .env.docker
    volumes:
      - app_public:/var/www/html/public
    environment:
      LOAD_FIXTURES: "${LOAD_FIXTURES}"
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}"
      REDIS_URL: "redis://redis:6379"
      MERCURE_URL: "http://mercure:3000/.well-known/mercure"
      MERCURE_PUBLIC_URL: "http://localhost:3000/.well-known/mercure"
      MERCURE_JWT_SECRET: "${MERCURE_JWT_KEY}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_started
    networks: [ backend ]

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - app_public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [ app ]
    networks: [ backend ]

  db:
    image: mysql:8.0
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ backend ]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ backend ]

  mercure:
    image: dunglas/mercure:v0.16.3
    env_file:
      - .env.docker
    environment:
      SERVER_NAME: "${MERCURE_SERVER_NAME}"
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_JWT_KEY}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_JWT_KEY}"
      CORS_ALLOWED_ORIGINS: "${MERCURE_CORS_ALLOWED_ORIGINS}"
      PUBLISH_ALLOWED_ORIGINS: "${MERCURE_PUBLISH_ALLOWED_ORIGINS}"
    ports:
      - "3000:3000"
    networks: [ backend ]

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on: [ db ]
    networks: [ backend ]
    profiles: [ tools ]

  mail:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [ backend ]
    profiles: [ tools ]

volumes:
  mysql_data:
  redis_data:
  app_public:

networks:
  backend:
    driver: bridge